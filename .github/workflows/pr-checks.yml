name: PR Quality Checks

on:
    pull_request:
        branches:
            - main
            - master
            - develop
    workflow_dispatch: # Allow manual triggering

env:
    NODE_VERSION: "18.x"

jobs:
    # Quality Checks
    quality-checks:
        name: Code Quality Checks
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: "npm"

            - name: Install dependencies
              run: npm ci

            - name: Run ESLint
              run: npm run lint
              continue-on-error: false

            - name: Check code formatting
              run: npm run format:check
              continue-on-error: false

            - name: Comment PR with lint results
              if: always()
              uses: actions/github-script@v7
              with:
                  script: |
                      const fs = require('fs');
                      const lintOutput = 'Linting and formatting checks completed.';
                      github.rest.issues.createComment({
                        issue_number: context.issue.number,
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        body: `## Code Quality Checks\n\n${lintOutput}`
                      });

    # Unit Tests
    unit-tests:
        name: Unit Tests
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: "npm"

            - name: Install dependencies
              run: npm ci

            - name: Run unit tests
              run: npm run test:ci
              continue-on-error: false

            - name: Upload coverage reports
              uses: codecov/codecov-action@v3
              if: always()
              with:
                  file: ./coverage/lcov.info
                  flags: unittests
                  name: codecov-umbrella
                  fail_ci_if_error: false

    # Build Verification
    build-verification:
        name: Build Verification
        runs-on: ubuntu-latest
        needs: [quality-checks]
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: "npm"

            - name: Install dependencies
              run: npm ci

            - name: Build production bundle
              run: npm run build:prod
              continue-on-error: false

            - name: Check bundle size
              run: |
                  echo "## Bundle Size Check" >> $GITHUB_STEP_SUMMARY
                  du -sh dist/grosint-frontend/* | sort -h >> $GITHUB_STEP_SUMMARY

            - name: Upload build artifacts
              uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: pr-build-${{ github.event.pull_request.number }}
                  path: dist/grosint-frontend
                  retention-days: 1

    # PR Summary
    pr-summary:
        name: PR Summary
        runs-on: ubuntu-latest
        needs: [quality-checks, unit-tests, build-verification]
        if: always()
        steps:
            - name: PR Check Summary
              uses: actions/github-script@v7
              with:
                  script: |
                      const qualityStatus = '${{ needs.quality-checks.result }}';
                      const testStatus = '${{ needs.unit-tests.result }}';
                      const buildStatus = '${{ needs.build-verification.result }}';

                      const allPassed = qualityStatus === 'success' && testStatus === 'success' && buildStatus === 'success';

                      const body = `## ✅ PR Quality Checks Summary

                      | Check | Status |
                      |-------|--------|
                      | Code Quality (Lint & Format) | ${qualityStatus === 'success' ? '✅ Passed' : '❌ Failed'} |
                      | Unit Tests | ${testStatus === 'success' ? '✅ Passed' : '❌ Failed'} |
                      | Build Verification | ${buildStatus === 'success' ? '✅ Passed' : '❌ Failed'} |

                      ${allPassed ? '🎉 All checks passed! Ready for review.' : '⚠️ Some checks failed. Please review and fix issues.'}
                      `;

                      github.rest.issues.createComment({
                        issue_number: context.issue.number,
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        body: body
                      });
