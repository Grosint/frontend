<div class="login-container">
  <div class="login-card">
    <h1 class="login-title">Welcome Back</h1>
    <p class="login-subtitle">Sign in to your account</p>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
      <div class="form-group">
        <label for="phone">Mobile Number</label>
        <input
          type="tel"
          id="phone"
          formControlName="phone"
          placeholder="Enter your mobile number"
          class="form-input"
          [class.error]="loginForm.get('phone')?.invalid && loginForm.get('phone')?.touched"
        />
        <div
          class="error-message"
          *ngIf="loginForm.get('phone')?.invalid && loginForm.get('phone')?.touched"
        >
          <span *ngIf="loginForm.get('phone')?.errors?.['required']">
            Mobile number is required
          </span>
          <span *ngIf="loginForm.get('phone')?.errors?.['pattern']">
            Invalid mobile number format
          </span>
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>

        <div class="password-field">
          <input
            [type]="hidePassword ? 'password' : 'text'"
            id="password"
            formControlName="password"
            placeholder="Enter password"
            class="form-input password"
            [class.error]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched"
          />
          <button
            type="button"
            class="eye-toggle"
            (click)="hidePassword = !hidePassword"
            aria-label="Toggle password visibility"
          >
            <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
        </div>
        <div
          class="error-message"
          *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched"
        >
          <span *ngIf="loginForm.get('password')?.errors?.['required']">Password is required</span>
          <span *ngIf="loginForm.get('password')?.errors?.['minlength']">
            Password must be at least 8 characters
          </span>
        </div>
      </div>

      <div class="error-message" *ngIf="errorMessage">
        {{ errorMessage }}
      </div>

      <app-button
        type="submit"
        variant="primary"
        size="lg"
        [loading]="isLoading"
        [disabled]="loginForm.invalid || isLoading"
        [fullWidth]="true"
        class="login-button"
      >
        Sign In
      </app-button>
    </form>

    <div class="login-footer">
      <p>Don't have an account? <a routerLink="/auth/signup">Sign Up</a></p>
    </div>
  </div>
</div>
