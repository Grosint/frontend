<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <img
        src="assets/data/grosint logo (blue without text ).png"
        alt="Grosint Logo"
        class="login-logo"
      />
    </div>
    <h1 class="login-title">Grosint</h1>
    <p class="login-subtitle">OSINT Intelligence Platform</p>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
      <div class="form-group">
        <label for="phone">Mobile Number</label>
        <div class="phone-input-group">
          <select
            id="countryCode"
            formControlName="countryCode"
            class="form-input country-code-select"
            aria-label="Country code"
          >
            <option value="+91">+91</option>
            <option value="+1">+1</option>
            <option value="+44">+44</option>
            <option value="+971">+971</option>
          </select>
          <input
            type="tel"
            id="phone"
            formControlName="phone"
            placeholder="Enter your mobile number"
            class="form-input phone-number-input"
            inputmode="numeric"
            (keypress)="onPhoneKeyPress($event)"
            (paste)="onPhonePaste($event)"
            [class.error]="loginForm.get('phone')?.invalid && loginForm.get('phone')?.touched"
          />
        </div>
        <div
          class="error-message"
          *ngIf="loginForm.get('phone')?.invalid && loginForm.get('phone')?.touched"
        >
          <span *ngIf="loginForm.get('phone')?.errors?.['required']">
            Mobile number is required
          </span>
          <span *ngIf="loginForm.get('phone')?.errors?.['pattern']">
            Invalid mobile number format
          </span>
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>

        <div class="password-field">
          <input
            [type]="hidePassword ? 'password' : 'text'"
            id="password"
            formControlName="password"
            placeholder="Enter password"
            class="form-input password"
            [class.error]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched"
          />
          <button
            type="button"
            class="eye-toggle"
            (click)="hidePassword = !hidePassword"
            aria-label="Toggle password visibility"
          >
            <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
        </div>
        <div
          class="error-message"
          *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched"
        >
          <span *ngIf="loginForm.get('password')?.errors?.['required']">Password is required</span>
          <span *ngIf="loginForm.get('password')?.errors?.['minlength']">
            Password must be at least 8 characters
          </span>
        </div>
      </div>

      <div class="error-message" *ngIf="errorMessage">
        {{ errorMessage }}
      </div>

      <app-button
        type="submit"
        variant="primary"
        size="lg"
        [loading]="isLoading"
        [disabled]="loginForm.invalid || isLoading"
        [fullWidth]="true"
        class="login-button"
      >
        Sign In
      </app-button>
    </form>

    <div class="login-footer">
      <p>Don't have an account? <a routerLink="/auth/register">Sign Up</a></p>
    </div>
  </div>
</div>
