<div class="register-otp-container">
  <div class="register-card">
    <h1 class="register-title">Verify Email</h1>
    <p class="register-subtitle">We've sent a 6-digit OTP to {{ email }}</p>

    <form [formGroup]="otpForm" (ngSubmit)="onSubmit()" class="register-form">
      <div class="form-group">
        <label for="otp">Enter OTP</label>
        <input
          type="text"
          id="otp"
          formControlName="otp"
          placeholder="Enter OTP"
          maxlength="6"
          class="form-input otp-input"
          [class.error]="otpForm.get('otp')?.invalid && otpForm.get('otp')?.touched"
        />
        <div
          class="error-message"
          *ngIf="otpForm.get('otp')?.invalid && otpForm.get('otp')?.touched"
        >
          <span *ngIf="otpForm.get('otp')?.errors?.['required']">OTP is required</span>
          <span *ngIf="otpForm.get('otp')?.errors?.['pattern']">OTP must be 6 digits</span>
        </div>
      </div>

      <div class="error-message" *ngIf="errorMessage">
        {{ errorMessage }}
      </div>

      <app-button
        type="submit"
        variant="primary"
        size="lg"
        [loading]="isLoading"
        [disabled]="otpForm.invalid || isLoading"
        [fullWidth]="true"
        class="action-button"
      >
        Verify OTP
      </app-button>

      <div class="register-footer">
        <button type="button" class="link-button" (click)="resendOtp()" [disabled]="isResending">
          <span *ngIf="!isResending">Resend OTP</span>
          <span *ngIf="isResending">Sending...</span>
        </button>
        <button type="button" class="link-button" (click)="goBack()">Back</button>
      </div>
    </form>
  </div>
</div>
