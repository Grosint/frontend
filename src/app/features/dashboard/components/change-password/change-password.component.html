<div class="edit-profile-section">
  <h3 class="edit-title">Change Password</h3>
  <form [formGroup]="changePasswordForm" class="profile-form">
    <div class="form-group">
      <label for="currentPassword">Current Password</label>
      <div class="password-field">
        <input
          type="text"
          id="currentPassword"
          formControlName="currentPassword"
          class="form-input password"
          [type]="hideCurrentPassword ? 'password' : 'text'"
          placeholder="Current Password"
        />
        <button
          type="button"
          class="eye-toggle"
          (click)="hideCurrentPassword = !hideCurrentPassword"
          aria-label="Toggle password visibility"
        >
          <i [class]="hideCurrentPassword ? 'fas fa-eye' : 'fas fa-eye-slash'"></i>
        </button>
      </div>
      <span
        class="error-message"
        *ngIf="
          changePasswordForm.get('currentPassword')?.invalid &&
          changePasswordForm.get('currentPassword')?.touched
        "
      >
        Current Password is required
      </span>
    </div>

    <div class="form-group">
      <label for="newPassword">New Password</label>
      <div class="password-field">
        <input
          type="text"
          id="newPassword"
          formControlName="newPassword"
          class="form-input password"
          [type]="hideNewPassword ? 'password' : 'text'"
          placeholder="New Password"
        />
        <button
          type="button"
          class="eye-toggle"
          (click)="hideNewPassword = !hideNewPassword"
          aria-label="Toggle password visibility"
        >
          <i [class]="hideNewPassword ? 'fas fa-eye' : 'fas fa-eye-slash'"></i>
        </button>
      </div>
      <span
        class="error-message"
        *ngIf="
          changePasswordForm.get('newPassword')?.invalid &&
          changePasswordForm.get('newPassword')?.touched
        "
      >
        <span *ngIf="changePasswordForm.get('newPassword')?.errors?.['required']">
          New Password is required
        </span>
        <span *ngIf="changePasswordForm.get('newPassword')?.errors?.['minlength']">
          Password must be at least 8 characters. Password must contain uppercase, lowercase, number
          and special character
        </span>
      </span>
    </div>

    <div class="form-group">
      <label for="confirmPassword">Confirm New Password</label>
      <div class="password-field">
        <input
          type="text"
          id="confirmPassword"
          formControlName="confirmPassword"
          class="form-input password"
          [type]="hideConfirmPassword ? 'password' : 'text'"
          placeholder="Confirm New Password"
        />
        <button
          type="button"
          class="eye-toggle"
          (click)="hideConfirmPassword = !hideConfirmPassword"
          aria-label="Toggle password visibility"
        >
          <i [class]="hideConfirmPassword ? 'fas fa-eye' : 'fas fa-eye-slash'"></i>
        </button>
      </div>
      <span
        class="error-message"
        *ngIf="
          changePasswordForm.get('confirmPassword')?.invalid &&
          changePasswordForm.get('confirmPassword')?.touched
        "
      >
        <span *ngIf="changePasswordForm.get('confirmPassword')?.errors?.['required']">
          Confirm Password is required
        </span>
        <span *ngIf="changePasswordForm.get('confirmPassword')?.errors?.['passwordMismatch']">
          Passwords do not match
        </span>
      </span>
    </div>

    <div class="api-error-message" *ngIf="errorMessage">
      <i class="fas fa-exclamation-circle"></i>
      <span>{{ errorMessage }}</span>
    </div>

    <div class="form-actions">
      <button
        type="button"
        class="save-button"
        (click)="savePassword()"
        [disabled]="changePasswordForm.invalid || isLoading || isButtonDisabled()"
      >
        <span *ngIf="!isLoading">Change Password</span>
        <span *ngIf="isLoading">Changing...</span>
      </button>
      <button
        type="button"
        class="cancel-button"
        (click)="cancelChangePassword()"
        [disabled]="isLoading"
      >
        Cancel
      </button>
    </div>
  </form>
</div>
