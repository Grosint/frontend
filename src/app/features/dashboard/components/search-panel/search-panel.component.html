<div class="search-panel">
  <div class="search-panel-header">
    <h3>Search</h3>
    <div class="selected-option" *ngIf="selectedOption">
      <span class="option-label">{{ getDisplayText() }}</span>
    </div>
    <div class="no-selection" *ngIf="!selectedOption">
      <span>{{ getDisplayText() }}</span>
    </div>
  </div>

  <div class="search-panel-content">
    <div class="search-container">
      <div class="search-input-wrapper">
        <input
          type="text"
          class="search-input"
          [(ngModel)]="searchQuery"
          [placeholder]="searchPlaceholder"
          [disabled]="!selectedOption || isLoading"
          (keypress)="onKeyPress($event)"
        />
      </div>
      <button
        type="button"
        class="search-button"
        [disabled]="!selectedOption || !searchQuery.trim() || isLoading"
        (click)="onSearch()"
      >
        <span *ngIf="!isLoading">Search</span>
        <span *ngIf="isLoading">Searching...</span>
      </button>
    </div>

    <!-- Error Message -->
    <div class="error-message" *ngIf="errorMessage">
      {{ errorMessage }}
    </div>

    <!-- Animated Search Icon - Show when search has been performed -->
    <div class="search-animation-container" *ngIf="isLoading">
      <div class="search-animation-wrapper">
        <div class="search-icon-animation">
          <i class="fas fa-search search-icon"></i>
        </div>
        <p class="search-animation-caption">Start searching to see results!</p>
      </div>
    </div>

    <!-- Search Results -->
    <div class="search-results" *ngIf="searchResults.length > 0">
      <div class="results-header">
        <h4>Search Results</h4>
        <div class="results-meta" *ngIf="searchResponse?.data">
          <span>Total: {{ searchResponse?.data?.results?.length }}</span>
        </div>
      </div>
      <div class="results-list">
        <app-result-card
          *ngFor="let result of searchResults; let i = index"
          [result]="result"
          [index]="i"
        ></app-result-card>
      </div>
    </div>

    <!-- No Results Message -->
    <div class="no-results" *ngIf="searchResponse && searchResults.length === 0">
      <p>No results found for this search.</p>
    </div>
  </div>
</div>
