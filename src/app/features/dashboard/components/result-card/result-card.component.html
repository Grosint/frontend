<div class="result-card" [class.not-found]="result.found === false">
  <div class="result-card-header" *ngIf="!showCompactValueOnly">
    <span class="result-source chip" *ngIf="showSource">{{ result.source }}</span>
    <span class="result-value-inline" *ngIf="!isImageResult">{{ displayValue }}</span>
  </div>
  <div>
    <ng-container *ngIf="isImageResult && imageSrc; else textValue">
      <div class="image-block">
        <div class="image-block-title">Photos</div>
        <img class="result-image" [src]="imageSrc" alt="Result" />
      </div>
    </ng-container>
    <ng-template #textValue>
      <div class="result-value" *ngIf="showCompactValueOnly">{{ displayValue }}</div>
    </ng-template>
  </div>
  <div class="result-card-footer" *ngIf="result.confidence !== undefined && !showCompactValueOnly">
    <span class="confidence">Confidence: {{ result.confidence | number: '1.1-1' }}%</span>
  </div>
</div>
