<div class="dashboard-container">
  <div class="dashboard-layout">
    <app-navbar class="dashboard-navbar" (selectionChange)="onSelectionChange($event)"></app-navbar>
    <app-search-panel
      class="dashboard-search-panel"
      [selectedOption]="selectedOption"
      (search)="onSearch($event)"
    ></app-search-panel>
  </div>
</div>
