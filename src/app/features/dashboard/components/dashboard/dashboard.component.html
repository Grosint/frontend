<div class="dashboard-container">
  <header class="dashboard-header">
    <h1>Dashboard</h1>
    <div class="user-info" *ngIf="user">
      <span>Welcome, {{ user.name }}</span>
      <app-button variant="ghost" size="sm" (onClick)="logout()"> Logout </app-button>
    </div>
  </header>

  <main class="dashboard-content">
    <div class="dashboard-card">
      <h2>Welcome to GrosInt</h2>
      <p>Your application is ready to use. Start building your features!</p>
    </div>
  </main>
</div>
