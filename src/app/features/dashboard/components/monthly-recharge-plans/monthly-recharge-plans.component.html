<h2 class="section-title">Monthly Recharge Plans</h2>
<div class="monthly-plans-grid">
  <div
    *ngFor="let plan of plans"
    class="monthly-plan-card"
    [class.selected]="selectedPlan?.id === plan.id"
    (click)="selectPlan(plan)"
    (keyup.enter)="selectPlan(plan)"
    (keyup.space)="selectPlan(plan)"
    tabindex="0"
    role="button"
    [attr.aria-label]="'Select ' + plan.name + ' plan'"
  >
    <div class="auto-renewal-badge">AUTO-RENEWAL</div>
    <h3 class="plan-name">{{ plan.name }}</h3>
    <div class="plan-price">₹{{ plan.price }}/month</div>
    <div class="plan-credits">{{ plan.credits }} credits/month</div>
    <div class="renewal-date">
      <span class="renewal-label">Next renewal:</span>
      <span class="renewal-value">{{ plan.nextRenewal }}</span>
    </div>
    <button
      class="subscribe-button"
      [class.selected-button]="selectedPlan?.id === plan.id"
      (click)="onSubscribe(plan, $event)"
    >
      Subscribe Now
    </button>
    <ul class="plan-features">
      <li *ngFor="let feature of plan.features">
        <i class="fas fa-check"></i>
        {{ feature }}
      </li>
    </ul>
  </div>
</div>
